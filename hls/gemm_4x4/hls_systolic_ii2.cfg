# hls_systolic_ii2.cfg -- 4x4 float32 systolic array, II=2 design point.
#
#   v++       -c    --mode hls          --config hls_systolic_ii2.cfg --work_dir work_ii2
#   vitis-run --mode hls --csim         --config hls_systolic_ii2.cfg --work_dir work_ii2
#   vitis-run --mode hls --cosim        --config hls_systolic_ii2.cfg --work_dir work_ii2
#
# The II target lives in the source as the TARGET_II macro (design.h),
# so a design point is selected purely by a -D here. Nothing else differs
# between the two configs -- keeping the sweep in the build rather than in
# edited source means the two runs are genuinely the same design.

part=xc7a35ticsg324-1L

[hls]
syn.file=design.cpp
syn.top=matmul_4x4x4
tb.file=testbench.cpp

clock=10ns
clock_uncertainty=12.5%

syn.directive.pipeline=matmul_4x4x4/time_loop II=2
