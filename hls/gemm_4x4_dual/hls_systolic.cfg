# hls_systolic.cfg -- 4x4 systolic array (fixed-point datapath, float
# interface), II=1 design point.
#
#   v++       -c    --mode hls   --config hls_systolic.cfg --work_dir work_fx_ii1
#   vitis-run --mode hls --csim  --config hls_systolic.cfg --work_dir work_fx_ii1
#   vitis-run --mode hls --cosim --config hls_systolic.cfg --work_dir work_fx_ii1
#
# The II is set HERE, not in the source (Vitis does not macro-expand
# pragma text; syn.directive.pipeline is what actually takes effect).

part=xc7a35ticsg324-1L

[hls]
syn.file=design.cpp
syn.top=matmul_4x4x4
tb.file=testbench.cpp

clock=10ns
clock_uncertainty=12.5%

syn.directive.pipeline=matmul_4x4x4/time_loop II=1
