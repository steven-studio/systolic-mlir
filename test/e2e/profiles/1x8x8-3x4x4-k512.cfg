# 1x8x8-3x4x4-k512.cfg
#
# FPGA configuration for 1x8x8 + 3x4x4.
# K_MAX_8X8 = 512
# K_MAX_4X4 = 512
#
# IMPORTANT:
# This configuration must match the bitstream actually programmed
# onto the FPGA. Host-side checks cannot verify FPGA registers.

K_MAX_8X8=512
K_MAX_4X4=512
N=8
NUM_8X8=1
NUM_4X4=3
HOST_SLAB_BYTES=32768
