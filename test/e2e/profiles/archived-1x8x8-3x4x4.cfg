# archived-1x8x8-3x4x4.cfg -- the archived bitstream, in the KEY=VALUE form of
# SYSTOLIC_FPGA_CONFIG (runtime/fpga_matmul_tiled.h, fpga_runtime_get_config).
#
#   test/e2e/run_e2e.sh --backend board --profile archived-1x8x8-3x4x4
#
# Only for a board programmed with
# artifacts/fpga/tile_pipelined/1x8x8-3x4x4/systolic_dma_top_1x8x8_3x4x4.bit
# (tag tile-pipelined-1x8x8-3x4x4-20261009). Nothing uses this file unless it
# is asked for: the E2E harness has no default configuration.
#
# That bitstream was built before dma_top_build.tcl wrote fpga_config.txt, so
# this is a transcription, not the build's own record: K = 16 for the 8x8 and
# for every 4x4 is the archive's README ("K dimension: 16"); N, NUM_8X8 and
# NUM_4X4 are its fleet; HOST_SLAB_BYTES is what 16 / 16 implies,
# ceil(16 / 8) windows x 512 B. BITSTREAM is relative to this file's
# directory; BITSTREAM_SHA256 is the hash of that file and of the archive's
# SHA256SUMS since commit 1a22f76 (2026-10-12), which committed the .bit.
# Before it, SHA256SUMS (commit 7d2d28b) and run_e2e.sh / docs/E2E.md quoted
# b9087bade05bd5efc9cad456736a3c0ebb757e62de64d824de0c79e691e7f3e0 for the
# same file name; the repository does not record why the two differ.
#
# Variable-K: the runtime sends each invocation's own k (1..16). This
# bitstream ran only k = 16 on the board (2026-10-09); a descriptor with
# k < 16 has not been run on it, nor simulated with its RTL (docs/E2E.md,
# Section 2.3). The harness cannot check which bitstream the board holds: the
# FPGA does not report its K_MAX.
K_MAX_8X8=16
K_MAX_4X4=16
N=8
NUM_8X8=1
NUM_4X4=3
HOST_SLAB_BYTES=1024
BITSTREAM=../../../artifacts/fpga/tile_pipelined/1x8x8-3x4x4/systolic_dma_top_1x8x8_3x4x4.bit
BITSTREAM_SHA256=71b6847d5b4c30b23fc99c5ff30a24254552161702ddfd1fb79a3d5657edff7d
